services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - db
  db:
    image: postgres:16
  rest:
    image: postgrest/postgrest:latest
  meta:
    image: supabase/postgres-meta:v0.80.0
  otel-collector:
    image: otel/opentelemetry-collector:latest
